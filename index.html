<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<title>Live-Lok (automatisch aktualisiert)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  h1 {
    text-align: center;
  }
  iframe {
    width: 100%;
    height: 700px;
    border: 1px solid #ccc;
  }
</style>
</head>
<body><h1>Live-Ansicht der Lok</h1>
<p>Die Ansicht wird automatisch alle 5 Minuten aktualisiert.</p><iframe id="lokFrame"></iframe><script>
  const targetUrl = "https://konzern-apps.web.oebb.at/lok/index/1116.0152";

  // Kostenloser Proxy (umgeht X-Frame-Options / CORS)
  function proxy(url) {
    return "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
  }

  async function loadLok() {
    const iframe = document.getElementById('lokFrame');
    try {
      const response = await fetch(proxy(targetUrl));
      const html = await response.text();
      iframe.srcdoc = html;
    } catch (e) {
      iframe.srcdoc = "<p style='color:red;'>Fehler beim Laden der Seite</p>";
      console.error(e);
    }
  }

  loadLok();                 // sofort laden
  setInterval(loadLok, 300000); // alle 5 Minuten (300.000 ms)
</script></body>
</html>
